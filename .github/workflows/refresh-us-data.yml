name: Refresh US data from FRED

on:
  schedule:
    - cron: "15 11 * * *"   # daily, 11:15 UTC (08:15 in Brasilia)
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh-us-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch series from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/fetch_fred.py
      - name: Publish if anything changed
        run: |
          git add data-us.js
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh US data from FRED"
          git push
